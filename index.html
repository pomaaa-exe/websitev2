<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>for Lelo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Special+Elite&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* =========================================================
   CONTROL CENTER — this is where you change the important stuff
   (the actual content is set further down in the <script> section,
   look for the "SETTINGS" comment)
   ========================================================= */

:root{
  --bg-0:#0b0509;
  --bg-1:#210b17;
  --bg-2:#331221;
  --ink:#fbeef1;
  --ink-dim:#dcb7c0;
  --accent:#ff8fab;
  --accent-deep:#c9184a;
  --accent-2:#ffc2d1;
  --glass:rgba(255,255,255,0.045);
  --glass-border:rgba(255,143,171,0.25);
}

*{box-sizing:border-box;}
html,body{
  margin:0;
  padding:0;
  height:100%;
  background:var(--bg-0);
  color:var(--ink);
  overflow:hidden;
  font-family:'Cormorant Garamond', serif;
  cursor:default;
  scrollbar-width:none;
  -ms-overflow-style:none;
}
html::-webkit-scrollbar, body::-webkit-scrollbar{
  display:none;
  width:0;
  height:0;
}

#bg-canvas{
  position:fixed;
  inset:0;
  z-index:0;
  background:
    radial-gradient(60% 50% at 50% 15%, rgba(255,143,171,0.16), transparent 60%),
    radial-gradient(70% 60% at 85% 90%, rgba(201,24,74,0.12), transparent 60%),
    radial-gradient(70% 60% at 8% 85%, rgba(255,194,209,0.10), transparent 60%),
    linear-gradient(160deg, var(--bg-0), var(--bg-1) 55%, var(--bg-2));
}

.screen{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:2;
  opacity:0;
  pointer-events:none;
  transition:opacity .6s ease;
  padding:24px;
  text-align:center;
}
.screen.active{
  opacity:1;
  pointer-events:auto;
}

/* ---------- IRIS TRANSITION OVERLAY ---------- */
#overlay{
  position:fixed;
  inset:0;
  z-index:60;
  pointer-events:none;
  background:radial-gradient(circle at 50% 50%, var(--bg-2) 0%, var(--bg-0) 70%);
  clip-path:circle(0% at 50% 50%);
}
#overlay.expand{
  clip-path:circle(150% at 50% 50%);
  transition:clip-path 1.25s cubic-bezier(.65,0,.35,1);
}
#overlay.contract{
  clip-path:circle(0% at 50% 50%);
  transition:clip-path 1.25s cubic-bezier(.65,0,.35,1);
}

/* ---------- Hearts trailing the cursor ---------- */
.trail-heart{
  position:fixed;
  z-index:80;
  pointer-events:none;
  color:var(--accent);
  text-shadow:0 0 10px rgba(255,143,171,0.75), 0 0 22px rgba(201,24,74,0.35);
  transform:translate(-50%,-50%);
  animation:heartFloat 1050ms ease-out forwards;
  will-change:transform, opacity;
}
@keyframes heartFloat{
  0%{
    opacity:.95;
    transform:translate(-50%,-50%) scale(.6) rotate(0deg);
  }
  100%{
    opacity:0;
    transform:translate(calc(-50% + var(--dx)), calc(-50% - 60px)) scale(1.15) rotate(var(--rot));
  }
}

/* ================= PROFILE CARD (guns.lol style) ================= */

/* Stage that holds both the spinning vinyl record and the card on top of it */
.vinyl-stage{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  max-width:380px;
  width:100%;
}

/* Spinning vinyl record - sits behind the card, mostly transparent so it
   blends into the page's own background instead of looking like a sticker.
   mix-blend-mode:screen makes the black areas of the disc disappear entirely -
   only the soft pink grooves and label stay faintly visible while spinning. */
.vinyl-record{
  position:absolute;
  width:172%;
  max-width:640px;
  aspect-ratio:1 / 1;
  z-index:0;
  opacity:.55;
  mix-blend-mode:screen;
  pointer-events:none;
  animation:vinylSpin 10s linear infinite;
  filter:drop-shadow(0 0 50px rgba(255,143,171,0.18));
}
@keyframes vinylSpin{ to{ transform:rotate(360deg); } }

@media (prefers-reduced-motion: reduce){
  .vinyl-record{ animation:none; }
}

.glow-border{
  position:relative;
  z-index:1;
  border-radius:26px;
  padding:1.5px;
  opacity:0;
  transform:translateY(18px) scale(.97);
  animation:cardIn 1s cubic-bezier(.16,1,.3,1) forwards;
  animation-delay:.15s;
  max-width:380px;
  width:100%;
}
@keyframes cardIn{
  to{ opacity:1; transform:translateY(0) scale(1); }
}
.glow-border::before{
  content:"";
  position:absolute;
  inset:-1.5px;
  border-radius:26px;
  background:linear-gradient(135deg, var(--accent), var(--accent-2), var(--accent-deep));
  opacity:.55;
  z-index:0;
}

.card{
  position:relative;
  z-index:1;
  border-radius:24.5px;
  background:linear-gradient(180deg, rgba(42,15,28,0.82), rgba(14,5,9,0.9));
  backdrop-filter:blur(20px) saturate(130%);
  -webkit-backdrop-filter:blur(20px) saturate(130%);
  padding:34px 28px 28px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.avatar{
  width:88px;
  height:88px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:radial-gradient(circle at 35% 30%, rgba(255,143,171,0.35), rgba(14,5,9,0.6));
  border:1px solid rgba(255,143,171,0.35);
  box-shadow:0 0 30px rgba(201,24,74,0.28);
  font-size:2.1rem;
  overflow:hidden;
  margin-bottom:14px;
}
.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-name{
  font-family:'Sora', sans-serif;
  font-weight:700;
  font-size:1.25rem;
  letter-spacing:.02em;
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--ink);
}
.profile-name .badge-icon{
  font-size:1rem;
  filter:drop-shadow(0 0 6px rgba(255,143,171,0.7));
}

.profile-bio{
  font-family:'Sora', sans-serif;
  font-size:.85rem;
  color:var(--ink-dim);
  margin-top:8px;
  min-height:1.4em;
  letter-spacing:.01em;
}
.profile-bio .caret{
  display:inline-block;
  width:2px;
  height:.9em;
  background:var(--accent);
  margin-left:2px;
  vertical-align:-2px;
  animation:blink 1s step-end infinite;
}

.badges-row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
  margin-top:16px;
}
.badge-pill{
  font-family:'Sora', sans-serif;
  font-size:.72rem;
  letter-spacing:.02em;
  color:var(--ink);
  background:var(--glass);
  border:1px solid var(--glass-border);
  border-radius:50px;
  padding:6px 13px;
  opacity:0;
  transform:translateY(6px);
  animation:fadeUp .7s cubic-bezier(.22,1,.36,1) forwards;
}

/* ---------- Welcome title (above the card) ---------- */
#screen-welcome .title{
  font-weight:300;
  font-size:clamp(2.2rem, 7vw, 4rem);
  letter-spacing:.04em;
  margin:0 0 1.8rem 0;
  cursor:default;
  user-select:none;
  color:var(--ink);
  transition:letter-spacing .8s cubic-bezier(.22,1,.36,1);
}
#screen-welcome .title:hover{
  letter-spacing:.13em;
}
#screen-welcome .title span{
  display:inline-block;
  opacity:0;
  filter:blur(12px);
  transform:translateY(20px);
  animation:letterIn 1.3s cubic-bezier(.16,1,.3,1) forwards;
  transition:text-shadow .8s cubic-bezier(.22,1,.36,1), color .8s ease;
}
#screen-welcome .title:hover span{
  color:#ffffff;
  text-shadow:
    0 0 14px rgba(255,143,171,0.65),
    0 0 38px rgba(201,24,74,0.35),
    0 0 70px rgba(255,143,171,0.2);
}
@keyframes letterIn{
  to{ opacity:1; filter:blur(0); transform:translateY(0); }
}

/* ================= "TOGETHER SINCE" LIVE COUNTER ================= */
.together-counter{
  margin-top:24px;
  max-width:380px;
  width:100%;
  padding:20px 18px;
  border-radius:20px;
  background:rgba(11,5,9,0.4);
  border:1px solid rgba(255,143,171,0.18);
  backdrop-filter:blur(18px) saturate(130%);
  -webkit-backdrop-filter:blur(18px) saturate(130%);
  text-align:center;
  opacity:0;
  transform:translateY(14px);
  animation:fadeUp 1s cubic-bezier(.22,1,.36,1) forwards;
  animation-delay:1.05s;
}
.together-label{
  font-family:'Sora', sans-serif;
  font-size:.68rem;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--ink-dim);
  margin-bottom:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
}
.together-label .heart-tick{
  display:inline-block;
  color:var(--accent);
  animation:beatPulse 1.6s ease-in-out infinite;
  filter:drop-shadow(0 0 6px rgba(255,143,171,0.6));
}
.together-grid{
  display:flex;
  justify-content:center;
  align-items:flex-start;
  gap:0;
  flex-wrap:wrap;
}
.together-unit{
  display:flex;
  flex-direction:column;
  align-items:center;
  min-width:46px;
  padding:0 8px;
}
.together-unit .num{
  font-family:'Sora', sans-serif;
  font-weight:700;
  font-size:1.55rem;
  background:linear-gradient(135deg, var(--accent-2), var(--accent), var(--accent-deep));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  line-height:1;
  display:inline-block;
}
.together-unit .num.tick{
  animation:numberPop .32s cubic-bezier(.22,1,.36,1);
}
@keyframes numberPop{
  0%{ transform:scale(1); }
  35%{ transform:scale(1.28); }
  100%{ transform:scale(1); }
}
.together-unit .unit-label{
  margin-top:5px;
  font-family:'Sora', sans-serif;
  font-size:.6rem;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--ink-dim);
}
.together-sep{
  align-self:center;
  margin-top:-6px;
  font-family:'Sora', sans-serif;
  font-size:1.2rem;
  color:var(--ink-dim);
  opacity:.3;
}
@media (max-width:420px){
  .together-unit{ min-width:38px; padding:0 5px; }
  .together-unit .num{ font-size:1.25rem; }
  .together-sep{ display:none; }
}

.password-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
  margin-top:26px;
  opacity:0;
  animation:fadeUp 1.3s cubic-bezier(.22,1,.36,1) forwards;
  animation-delay:1.6s;
  width:100%;
}
@keyframes fadeUp{
  from{opacity:0; transform:translateY(16px);}
  to{opacity:1; transform:translateY(0);}
}

.password-bar{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--glass);
  border:1px solid var(--glass-border);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-radius:50px;
  padding:8px 8px 8px 26px;
  box-shadow:0 0 0 0 rgba(255,143,171,0.0);
  transition:box-shadow .6s cubic-bezier(.22,1,.36,1), border-color .6s cubic-bezier(.22,1,.36,1);
}
.password-bar:focus-within{
  border-color:rgba(255,143,171,0.65);
  box-shadow:0 0 26px 2px rgba(255,143,171,0.22);
}
.password-bar.shake{
  animation:shake .45s ease;
}
@keyframes shake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-8px);}
  40%{transform:translateX(7px);}
  60%{transform:translateX(-5px);}
  80%{transform:translateX(4px);}
}

.password-bar input{
  background:transparent;
  border:none;
  outline:none;
  color:var(--ink);
  font-family:'Cormorant Garamond', serif;
  font-size:1.1rem;
  letter-spacing:.04em;
  width:min(48vw, 200px);
  padding:8px 0;
}
.password-bar input::placeholder{
  color:var(--ink-dim);
  opacity:.7;
}

.password-bar button{
  border:none;
  border-radius:50%;
  width:40px;
  height:40px;
  min-width:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg, var(--accent), var(--accent-deep));
  color:#fff;
  cursor:pointer;
  transition:transform .45s cubic-bezier(.22,1,.36,1), filter .45s ease;
}
.password-bar button:hover{
  transform:scale(1.07);
  filter:brightness(1.1);
}
.password-bar button:active{
  transform:scale(.94);
}

.hint{
  min-height:1.2em;
  font-size:.9rem;
  letter-spacing:.03em;
  color:var(--accent);
  opacity:.85;
  font-family:'Sora', sans-serif;
}

.forgot-hint{
  margin-top:10px;
  font-family:'Sora', sans-serif;
  font-weight:300;
  font-size:.66rem;
  letter-spacing:.03em;
  color:var(--ink-dim);
  opacity:.32;
  transition:opacity .4s ease;
  cursor:default;
  user-select:none;
}
.forgot-hint:hover{
  opacity:.6;
}

/* ================= HEART SCREEN ================= */
#screen-heart .heart-caption{
  font-family:'Sora', sans-serif;
  font-size:.95rem;
  letter-spacing:.08em;
  color:var(--ink-dim);
  margin-bottom:2rem;
  opacity:.85;
  transition:opacity .5s ease;
}

.heart-holder{
  position:relative;
  width:min(46vw, 220px);
  height:min(46vw, 220px);
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.heart-holder svg{
  width:100%;
  height:100%;
  overflow:visible;
  filter:drop-shadow(0 0 20px rgba(255,143,171,0.5)) drop-shadow(0 0 50px rgba(201,24,74,0.25));
  animation:beat 2.6s cubic-bezier(.45,0,.55,1) infinite;
  transform-origin:50% 55%;
}
@keyframes beat{
  0%, 100%{transform:scale(1);}
  50%{transform:scale(1.055);}
}
.heart-holder.pulse svg{
  animation:none;
}
.heart-holder .burst{
  animation:beatPulse .6s cubic-bezier(.22,1,.36,1);
}
@keyframes beatPulse{
  0%{transform:scale(1);}
  45%{transform:scale(1.2);}
  100%{transform:scale(1);}
}

.progress-dots{
  display:flex;
  gap:8px;
  margin-top:2.2rem;
}
.progress-dots span{
  width:7px;
  height:7px;
  border-radius:50%;
  background:rgba(251,238,241,0.16);
  transition:background .5s cubic-bezier(.22,1,.36,1), transform .5s cubic-bezier(.22,1,.36,1);
}
.progress-dots span.filled{
  background:var(--accent);
  transform:scale(1.25);
  box-shadow:0 0 10px rgba(255,143,171,0.65);
}

.spark{
  position:absolute;
  pointer-events:none;
  font-size:1rem;
  color:var(--accent);
  animation:sparkFly 1100ms cubic-bezier(.16,1,.3,1) forwards;
}
@keyframes sparkFly{
  0%{ opacity:1; transform:translate(0,0) scale(.6) rotate(0deg); }
  100%{ opacity:0; transform:var(--fly) scale(1.05) rotate(140deg); }
}

/* ================= LETTER SCREEN ================= */
#screen-letter{
  overflow-y:auto;
  padding:60px 20px 150px;
  /* invisible scrollbar - scrolling still works, the bar just never shows */
  scrollbar-width:none;        /* Firefox */
  -ms-overflow-style:none;     /* IE/Edge */
}
#screen-letter::-webkit-scrollbar{
  display:none;                /* Chrome/Safari/Opera */
  width:0;
  height:0;
}
.paper{
  max-width:640px;
  width:100%;
  background:linear-gradient(180deg, rgba(51,18,33,0.55), rgba(14,5,9,0.55));
  color:var(--ink);
  border:1px solid rgba(255,143,171,0.16);
  border-radius:20px;
  padding:clamp(30px, 5vw, 64px);
  text-align:left;
  font-family:'Special Elite', monospace;
  box-shadow:0 0 90px rgba(255,143,171,0.06), 0 40px 90px rgba(0,0,0,0.45);
  backdrop-filter:blur(22px) saturate(120%);
  -webkit-backdrop-filter:blur(22px) saturate(120%);
  position:relative;
  opacity:0;
  transform:translateY(24px);
  animation:paperIn 1.4s cubic-bezier(.16,1,.3,1) forwards;
  animation-delay:.5s;
}
@keyframes paperIn{
  to{ opacity:1; transform:translateY(0); }
}
.paper h2{
  margin:0 0 1.4rem 0;
  font-size:1.05rem;
  letter-spacing:.08em;
  font-weight:400;
  color:var(--ink-dim);
  text-transform:uppercase;
}
#letter-body{
  white-space:pre-wrap;
  line-height:1.95;
  font-size:1.02rem;
  min-height:2em;
  color:var(--ink);
}
.letter-caret{
  display:inline-block;
  width:9px;
  background:var(--accent);
  margin-left:2px;
  animation:blink 1s step-end infinite;
}
@keyframes blink{
  50%{opacity:0;}
}

.tasks{
  max-width:640px;
  width:100%;
  margin-top:22px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.task-card{
  background:var(--glass);
  border:1px solid var(--glass-border);
  border-radius:16px;
  padding:16px 20px;
  text-align:left;
  backdrop-filter:blur(10px);
  opacity:0;
  transform:translateY(10px);
  animation:fadeUp .7s cubic-bezier(.22,1,.36,1) forwards;
}
.task-card h3{
  margin:0 0 4px 0;
  font-family:'Sora', sans-serif;
  font-weight:600;
  font-size:1rem;
  color:var(--accent);
  letter-spacing:.02em;
}
.task-card p{
  margin:0;
  color:var(--ink-dim);
  font-family:'Cormorant Garamond', serif;
  font-size:.98rem;
  line-height:1.5;
}

/* ================= MUSIC PLAYER (styl paska odtwarzacza) ================= */
#music-player{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translate(-50%, 160%);
  z-index:40;
  width:min(94vw, 640px);
  transition:transform .9s cubic-bezier(.16,1,.3,1);
}
#music-player.visible{
  transform:translate(-50%, 0);
}

.player-bar{
  display:flex;
  align-items:center;
  gap:18px;
  width:100%;
  padding:12px 20px;
  border-radius:22px;
  background:rgba(11,5,9,0.42);
  border:1px solid rgba(255,143,171,0.16);
  backdrop-filter:blur(22px) saturate(140%);
  -webkit-backdrop-filter:blur(22px) saturate(140%);
  box-shadow:0 10px 40px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,143,171,0.06);
}

.player-left{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  flex:0 1 220px;
}
.player-cover{
  width:46px;
  height:46px;
  border-radius:10px;
  object-fit:cover;
  flex-shrink:0;
  background:rgba(255,143,171,0.12);
  box-shadow:0 0 12px rgba(255,143,171,0.25);
}
.player-meta{
  min-width:0;
  text-align:left;
}
.player-title{
  font-family:'Sora', sans-serif;
  font-size:.86rem;
  font-weight:600;
  color:var(--ink);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  cursor:pointer;
}
.player-title:hover{ color:var(--accent); }
.player-artist{
  font-family:'Sora', sans-serif;
  font-size:.74rem;
  color:var(--ink-dim);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-top:2px;
}
.player-add{
  flex-shrink:0;
  width:22px;
  height:22px;
  border-radius:50%;
  border:1.5px solid var(--ink-dim);
  background:transparent;
  color:var(--ink-dim);
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Sora', sans-serif;
  font-size:.85rem;
  line-height:1;
  cursor:pointer;
  transition:border-color .3s ease, color .3s ease, transform .3s ease;
}
.player-add:hover{
  border-color:var(--accent);
  color:var(--accent);
  transform:scale(1.08);
}

.player-center{
  flex:1 1 auto;
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}

.player-controls{
  display:flex;
  align-items:center;
  gap:16px;
}
.ctrl{
  background:transparent;
  border:none;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--ink-dim);
  cursor:pointer;
  transition:color .25s ease, transform .2s ease;
}
.ctrl svg{ width:16px; height:16px; }
.ctrl:hover{ color:var(--ink); transform:scale(1.08); }
.ctrl.active{ color:var(--accent); }
.ctrl.play-pause{
  width:30px;
  height:30px;
  border-radius:50%;
  background:linear-gradient(135deg, var(--accent), var(--accent-deep));
  color:#fff;
}
.ctrl.play-pause svg{ width:14px; height:14px; }
.ctrl.play-pause:hover{
  transform:scale(1.07);
  filter:brightness(1.1);
}

.player-progress-row{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  max-width:520px;
}
.player-time{
  font-family:'Sora', sans-serif;
  font-size:.68rem;
  color:var(--ink-dim);
  min-width:30px;
  text-align:center;
}
.progress-track{
  position:relative;
  flex:1;
  height:4px;
  border-radius:4px;
  background:rgba(255,255,255,0.14);
  cursor:pointer;
}
.progress-fill{
  position:absolute;
  left:0; top:0; bottom:0;
  width:0%;
  border-radius:4px;
  background:linear-gradient(90deg, var(--accent), var(--accent-2));
}
.progress-handle{
  position:absolute;
  top:50%;
  left:0%;
  width:10px;
  height:10px;
  border-radius:50%;
  background:var(--ink);
  transform:translate(-50%,-50%);
  box-shadow:0 0 8px rgba(255,143,171,0.6);
  opacity:0;
  transition:opacity .2s ease;
}
.progress-track:hover .progress-handle{ opacity:1; }

@media (max-width:640px){
  .player-bar{ gap:10px; padding:10px 14px; }
  .player-left{ flex:0 1 140px; }
  .player-artist{ display:none; }
  .player-controls{ gap:10px; }
  .ctrl.shuffle, .ctrl.repeat{ display:none; }
}

/* ================= TOP-RIGHT NAV TABS ================= */
#top-nav{
  position:fixed;
  top:18px;
  right:18px;
  z-index:50;
  display:flex;
  gap:8px;
}
.nav-tab{
  font-family:'Sora', sans-serif;
  font-size:.78rem;
  letter-spacing:.03em;
  color:var(--ink-dim);
  background:var(--glass);
  border:1px solid var(--glass-border);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-radius:50px;
  padding:8px 18px;
  cursor:pointer;
  transition:color .3s ease, border-color .3s ease, transform .3s ease;
}
.nav-tab:hover{
  color:var(--ink);
  border-color:rgba(255,143,171,0.5);
  transform:translateY(-1px);
}

/* ---- back button used on chat screens ---- */
.back-btn{
  position:fixed;
  top:18px;
  left:18px;
  z-index:50;
  display:flex;
  align-items:center;
  gap:6px;
  font-family:'Sora', sans-serif;
  font-size:.78rem;
  color:var(--ink-dim);
  background:var(--glass);
  border:1px solid var(--glass-border);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-radius:50px;
  padding:8px 16px 8px 12px;
  cursor:pointer;
  transition:color .3s ease, border-color .3s ease, transform .3s ease;
}
.back-btn:hover{
  color:var(--ink);
  border-color:rgba(255,143,171,0.5);
  transform:translateX(-2px);
}
.back-btn svg{ width:14px; height:14px; }

/* ================= CHAT LOGIN SCREEN ================= */
.chat-login-box{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:18px;
  max-width:340px;
  width:100%;
}
.chat-login-box h2{
  font-family:'Sora', sans-serif;
  font-weight:600;
  font-size:1.3rem;
  color:var(--ink);
  margin:0;
  letter-spacing:.02em;
}
.chat-login-box p.sub{
  font-family:'Sora', sans-serif;
  font-size:.8rem;
  color:var(--ink-dim);
  margin:-10px 0 0 0;
  text-align:center;
}
.chat-field{
  width:100%;
  background:var(--glass);
  border:1px solid var(--glass-border);
  border-radius:14px;
  padding:12px 16px;
}
.chat-field input{
  width:100%;
  background:transparent;
  border:none;
  outline:none;
  color:var(--ink);
  font-family:'Sora', sans-serif;
  font-size:.95rem;
}
.chat-field input::placeholder{ color:var(--ink-dim); opacity:.7; }
.chat-login-submit{
  border:none;
  border-radius:50px;
  padding:12px 30px;
  font-family:'Sora', sans-serif;
  font-weight:600;
  font-size:.85rem;
  letter-spacing:.03em;
  color:#fff;
  background:linear-gradient(135deg, var(--accent), var(--accent-deep));
  cursor:pointer;
  transition:transform .3s ease, filter .3s ease;
}
.chat-login-submit:hover{ transform:scale(1.03); filter:brightness(1.08); }
.chat-login-error{
  min-height:1.1em;
  font-size:.8rem;
  color:var(--accent);
  font-family:'Sora', sans-serif;
}

/* ================= CHAT SCREEN ================= */
#screen-chat{
  padding:90px 16px 20px;
}
.chat-wrap{
  width:min(94vw, 480px);
  height:min(78vh, 640px);
  display:flex;
  flex-direction:column;
  border-radius:24px;
  overflow:hidden;
  background:rgba(11,5,9,0.5);
  border:1px solid rgba(255,143,171,0.16);
  backdrop-filter:blur(20px) saturate(130%);
  -webkit-backdrop-filter:blur(20px) saturate(130%);
  box-shadow:0 20px 60px rgba(0,0,0,0.4);
}
.chat-header{
  display:flex;
  align-items:center;
  gap:10px;
  padding:16px 20px;
  border-bottom:1px solid rgba(255,143,171,0.12);
  flex-shrink:0;
}
.chat-header .who{
  font-family:'Sora', sans-serif;
  font-weight:600;
  font-size:.95rem;
  color:var(--ink);
}
.status-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#5a5a5a;
  box-shadow:0 0 0 0 rgba(90,90,90,0);
  transition:background .3s ease, box-shadow .3s ease;
}
.status-dot.online{
  background:#3ddc84;
  box-shadow:0 0 8px rgba(61,220,132,0.7);
}
.status-text{
  font-family:'Sora', sans-serif;
  font-size:.7rem;
  color:var(--ink-dim);
}
.chat-messages{
  flex:1;
  overflow-y:auto;
  padding:18px 16px;
  display:flex;
  flex-direction:column;
  gap:10px;
  scrollbar-width:none;
  -ms-overflow-style:none;
}
.chat-messages::-webkit-scrollbar{ display:none; width:0; height:0; }
.msg-row{
  display:flex;
}
.msg-row.mine{ justify-content:flex-end; }
.msg-bubble{
  max-width:75%;
  padding:10px 14px;
  border-radius:16px;
  font-family:'Sora', sans-serif;
  font-size:.85rem;
  line-height:1.4;
  color:var(--ink);
  background:var(--glass);
  border:1px solid var(--glass-border);
}
.msg-row.mine .msg-bubble{
  background:linear-gradient(135deg, var(--accent), var(--accent-deep));
  color:#fff;
  border:none;
}
.msg-time{
  display:block;
  margin-top:4px;
  font-size:.62rem;
  opacity:.65;
}
.chat-input-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px 16px;
  border-top:1px solid rgba(255,143,171,0.12);
  flex-shrink:0;
}
.chat-input-row input{
  flex:1;
  background:var(--glass);
  border:1px solid var(--glass-border);
  border-radius:50px;
  padding:11px 18px;
  color:var(--ink);
  font-family:'Sora', sans-serif;
  font-size:.9rem;
  outline:none;
}
.chat-input-row input::placeholder{ color:var(--ink-dim); opacity:.7; }
.chat-send-btn{
  width:42px;
  height:42px;
  border-radius:50%;
  border:none;
  flex-shrink:0;
  background:linear-gradient(135deg, var(--accent), var(--accent-deep));
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:transform .3s ease, filter .3s ease;
}
.chat-send-btn:hover{ transform:scale(1.06); filter:brightness(1.08); }
.chat-send-btn svg{ width:16px; height:16px; }

@media (max-width:520px){
  .password-bar input{ width:42vw; }
  #top-nav{ top:12px; right:12px; }
  .back-btn{ top:12px; left:12px; }
}

@media (prefers-reduced-motion: reduce){

}

// ---------- "Together since" live counter ----------
(function togetherCounter(){
  const since = new Date(CONFIG.TOGETHER_SINCE + 'T00:00:00');
  if(isNaN(since.getTime())) return;

  document.getElementById('together-date').textContent =
    since.toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' });

  const elYears = document.getElementById('tc-years');
  const elMonths = document.getElementById('tc-months');
  const elDays = document.getElementById('tc-days');
  const elHours = document.getElementById('tc-hours');
  const elMins = document.getElementById('tc-mins');
  const elSecs = document.getElementById('tc-secs');

  function pop(el){
    el.classList.remove('tick');
    void el.offsetWidth;
    el.classList.add('tick');
  }
  function setNum(el, value, pad){
    const text = pad ? String(value).padStart(2, '0') : String(value);
    if(el.textContent !== text){
      el.textContent = text;
      pop(el);
    }
  }

  function update(){
    const now = new Date();
    if(now < since){
      setNum(elYears, 0); setNum(elMonths, 0); setNum(elDays, 0);
      setNum(elHours, 0, true); setNum(elMins, 0, true); setNum(elSecs, 0, true);
      return;
    }

    let years = now.getFullYear() - since.getFullYear();
    let months = now.getMonth() - since.getMonth();
    let days = now.getDate() - since.getDate();
    let hours = now.getHours() - since.getHours();
    let minutes = now.getMinutes() - since.getMinutes();
    let seconds = now.getSeconds() - since.getSeconds();

    if(seconds < 0){ seconds += 60; minutes--; }
    if(minutes < 0){ minutes += 60; hours--; }
    if(hours < 0){ hours += 24; days--; }
    if(days < 0){
      const prevMonthLastDay = new Date(now.getFullYear(), now.getMonth(), 0).getDate();
      days += prevMonthLastDay;
      months--;
    }
    if(months < 0){ months += 12; years--; }

    setNum(elYears, years);
    setNum(elMonths, months);
    setNum(elDays, days);
    setNum(elHours, hours, true);
    setNum(elMins, minutes, true);
    setNum(elSecs, seconds, true);
  }

  update();
  setInterval(update, 1000);
})();

// ---------- Gentle background particles ----------
(function particles(){
  const canvas = document.createElement('canvas');
  canvas.style.position = 'fixed';
  canvas.style.inset = '0';
  canvas.style.zIndex = '1';
  canvas.style.pointerEvents = 'none';
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  let w, h, particlesArr = [];
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const COUNT = Math.min(70, Math.floor(w / 22));
  for(let i=0;i<COUNT;i++){
    particlesArr.push({
      x: Math.random()*w,
      y: Math.random()*h,
      r: Math.random()*1.6 + 0.4,
      vy: -(Math.random()*0.25 + 0.05),
      vx: (Math.random()-0.5)*0.12,
      a: Math.random()*0.5 + 0.15,
      hue: Math.random() > 0.5 ? '255,143,171' : '255,194,209'
    });
  }

  function tick(){
    ctx.clearRect(0,0,w,h);
    particlesArr.forEach(p=>{
      p.y += p.vy;
      p.x += p.vx;
      if(p.y < -10){ p.y = h+10; p.x = Math.random()*w; }
      ctx.beginPath();
      ctx.fillStyle = `rgba(${p.hue},${p.a})`;
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fill();
    });
    if(!reduced) requestAnimationFrame(tick);
  }
  tick();
})();

// ---------- Music player ----------
// Custom player bar (cover, title, progress bar, buttons),
// styled transparent with rounded corners so it blends
// into the page background. The real cover and title are fetched from the public
// Spotify oEmbed. The real SOUND is played through the official
// Spotify Embed IFrame API (hidden container off-screen) - our bar
// only sends it commands (play/pause/seek) and displays
// prawdziwy, aktualny czas odtwarzania.
// IMPORTANT LIMITATION (on Spotify's side, can't be worked around): without
// logging into Spotify in this browser, only a
// 30-second preview will play, same as for any anonymous listener.
(function musicPlayer(){
  if(!CONFIG.SPOTIFY_TRACK_ID) return;

  const trackUrl = `https://open.spotify.com/track/${CONFIG.SPOTIFY_TRACK_ID}`;
  const coverEl = document.getElementById('player-cover');
  const titleEl = document.getElementById('player-title');
  const artistEl = document.getElementById('player-artist');
  const addBtn = document.getElementById('player-add');
  const playBtn = document.getElementById('ctrl-play');
  const iconPlay = document.getElementById('icon-play');
  const iconPause = document.getElementById('icon-pause');
  const shuffleBtn = document.getElementById('ctrl-shuffle');
  const repeatBtn = document.getElementById('ctrl-repeat');
  const progressTrack = document.getElementById('progress-track');
  const progressFill = document.getElementById('progress-fill');
  const progressHandle = document.getElementById('progress-handle');
  const timeCurrentEl = document.getElementById('time-current');
  const timeDurationEl = document.getElementById('time-duration');

  let durationSec = CONFIG.TRACK_DURATION_SECONDS || 150; // nadpisane prawdziwym czasem, gdy Spotify go poda
  let currentSec = 0;
  let playing = false;
  let controller = null;
  let controllerReady = false;

  function formatTime(sec){
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return m + ':' + String(s).padStart(2, '0');
  }
  function render(){
    const pct = durationSec ? Math.min(100, (currentSec / durationSec) * 100) : 0;
    progressFill.style.width = pct + '%';
    progressHandle.style.left = pct + '%';
    timeCurrentEl.textContent = formatTime(currentSec);
    timeDurationEl.textContent = formatTime(durationSec);
  }
  function setPlayingUI(state){
    playing = state;
    iconPlay.style.display = playing ? 'none' : 'block';
    iconPause.style.display = playing ? 'block' : 'none';
    playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
  }

  playBtn.addEventListener('click', ()=>{
    if(!controllerReady){ window.open(trackUrl, '_blank', 'noopener'); return; }
    controller.togglePlay();
  });
  document.getElementById('ctrl-prev').addEventListener('click', ()=>{
    if(!controllerReady) return;
    controller.seek(0);
  });
  document.getElementById('ctrl-next').addEventListener('click', ()=>{
    if(!controllerReady) return;
    controller.seek(0);
    controller.pause();
  });
  shuffleBtn.addEventListener('click', ()=> shuffleBtn.classList.toggle('active'));
  repeatBtn.addEventListener('click', ()=> repeatBtn.classList.toggle('active'));

  progressTrack.addEventListener('click', (e)=>{
    if(!controllerReady) return;
    const rect = progressTrack.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    controller.seek(ratio * durationSec);
  });

  function openTrack(){ window.open(trackUrl, '_blank', 'noopener'); }
  titleEl.addEventListener('click', openTrack);
  coverEl.addEventListener('click', openTrack);
  addBtn.addEventListener('click', openTrack);

  render();

  // Default data (used until/unless the real data is fetched from oEmbed)
  titleEl.textContent = CONFIG.TRACK_TITLE_FALLBACK || 'Nasza piosenka';
  artistEl.textContent = CONFIG.TRACK_ARTIST_FALLBACK || '';

  // Fetch the real cover and title from the public Spotify oEmbed
  fetch(`https://open.spotify.com/oembed?url=${encodeURIComponent(trackUrl)}`)
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(data => {
      const parts = (data.title || '').split(' - ');
      if(data.thumbnail_url) coverEl.src = data.thumbnail_url;
      titleEl.textContent = parts[0] || data.title || titleEl.textContent;
      artistEl.textContent = parts.slice(1).join(' - ') || artistEl.textContent;
    })
    .catch(()=>{ /* keep the default values */ });

  // Hook up real playback via the official Spotify Embed IFrame API
  window.onSpotifyIframeApiReady = (IFrameAPI) => {
    const element = document.getElementById('spotify-embed-holder');
    const options = {
      uri: `spotify:track:${CONFIG.SPOTIFY_TRACK_ID}`,
      width: '300',
      height: '80',
    };
    IFrameAPI.createController(element, options, (ctrl)=>{
      controller = ctrl;
      controller.addListener('ready', ()=>{
        controllerReady = true;
      });
      controller.addListener('playback_update', (e)=>{
        const data = e.data || {};
        if(data.duration){
          durationSec = data.duration / 1000;
        }
        if(typeof data.position === 'number'){
          currentSec = data.position / 1000;
        }
        setPlayingUI(!data.isPaused && !data.isBuffering);
        render();
      });
    });
  };

  setTimeout(()=>{
    document.getElementById('music-player').classList.add('visible');
  }, 1600);
})();

// ---------- Private chat ----------
// Passwords are never stored as plain text in this file - only as SHA-256
// hashes, so casually opening dev tools / view-source doesn't reveal them.
// NOTE (being upfront about the limits of a no-backend static page): this
// makes the password non-obvious to a casual visitor, but it isn't
// unbreakable - someone technical enough could still brute-force a hash or
// read the client-side check. Real secrecy of the messages themselves comes
// from this being your own private, unlisted Firebase project that only
// this page's code knows how to reach - not from the login screen alone.

// Pure-JS SHA-256 fallback: the browser's built-in crypto.subtle only works
// on pages served over HTTPS or localhost. If this file is opened directly
// (file://) or over plain HTTP, crypto.subtle is unavailable, so we fall
// back to this self-contained implementation instead (same standard SHA-256
// algorithm, just without relying on the browser API).
function sha256Sync(str){
  const K = [
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ];
  let H = [
    0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,
    0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19
  ];

  const utf8 = new TextEncoder().encode(str);
  const bitLen = utf8.length * 8;

  const withOne = new Uint8Array(((utf8.length + 9 + 63) >> 6) << 6);
  withOne.set(utf8);
  withOne[utf8.length] = 0x80;
  const dv = new DataView(withOne.buffer);
  dv.setUint32(withOne.length - 4, bitLen >>> 0);
  dv.setUint32(withOne.length - 8, Math.floor(bitLen / 4294967296));

  function rotr(x, n){ return (x >>> n) | (x << (32 - n)); }

  for(let chunk = 0; chunk < withOne.length; chunk += 64){
    const w = new Uint32Array(64);
    for(let i = 0; i < 16; i++){
      w[i] = dv.getUint32(chunk + i * 4);
    }
    for(let i = 16; i < 64; i++){
      const s0 = rotr(w[i-15],7) ^ rotr(w[i-15],18) ^ (w[i-15] >>> 3);
      const s1 = rotr(w[i-2],17) ^ rotr(w[i-2],19) ^ (w[i-2] >>> 10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) | 0;
    }

    let a=H[0], b=H[1], c=H[2], d=H[3], e=H[4], f=H[5], g=H[6], h=H[7];
    for(let i = 0; i < 64; i++){
      const S1 = rotr(e,6) ^ rotr(e,11) ^ rotr(e,25);
      const ch = (e & f) ^ (~e & g);
      const temp1 = (h + S1 + ch + K[i] + w[i]) | 0;
      const S0 = rotr(a,2) ^ rotr(a,13) ^ rotr(a,22);
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const temp2 = (S0 + maj) | 0;

      h = g; g = f; f = e; e = (d + temp1) | 0;
      d = c; c = b; b = a; a = (temp1 + temp2) | 0;
    }

    H[0] = (H[0] + a) | 0;
    H[1] = (H[1] + b) | 0;
    H[2] = (H[2] + c) | 0;
    H[3] = (H[3] + d) | 0;
    H[4] = (H[4] + e) | 0;
    H[5] = (H[5] + f) | 0;
    H[6] = (H[6] + g) | 0;
    H[7] = (H[7] + h) | 0;
  }

  return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}

async function sha256Hex(str){
  if(window.crypto && window.crypto.subtle && window.crypto.subtle.digest){
    try{
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    }catch(e){
      // fall through to the pure-JS version below
    }
  }
  return sha256Sync(str);
}

let chatInitialized = false;

function initChatUI(){
  const me = CONFIG.CHAT_USERS[chatCurrentUserKey];
  const otherKey = chatCurrentUserKey === 'her' ? 'him' : 'her';
  const other = CONFIG.CHAT_USERS[otherKey];

  document.getElementById('my-chat-name').textContent = "You";
  document.getElementById('other-chat-name').textContent = other.displayName;
  document.getElementById('my-status-dot').classList.add('online');

  if(chatInitialized) return; // Firebase listeners only need to be set up once
  chatInitialized = true;

  if(!CONFIG.FIREBASE_CONFIG || !CONFIG.FIREBASE_CONFIG.databaseURL){
    document.getElementById('chat-messages').innerHTML =
      '<div style="text-align:center;color:var(--ink-dim);font-family:Sora,sans-serif;font-size:.8rem;padding:20px;">Chat isn\'t connected yet - fill in CONFIG.FIREBASE_CONFIG in the code to enable real syncing.</div>';
    return;
  }

  firebase.initializeApp(CONFIG.FIREBASE_CONFIG);
  const db = firebase.database();

  // ---- Presence (online/offline dots) ----
  const myPresenceRef = db.ref('presence/' + chatCurrentUserKey);
  const otherPresenceRef = db.ref('presence/' + otherKey);
  const connectedRef = db.ref('.info/connected');

  connectedRef.on('value', (snap) => {
    if(snap.val() === true){
      myPresenceRef.onDisconnect().set({ online: false, last: firebase.database.ServerValue.TIMESTAMP });
      myPresenceRef.set({ online: true });
    }
  });

  otherPresenceRef.on('value', (snap) => {
    const data = snap.val();
    const dot = document.getElementById('other-status-dot');
    const text = document.getElementById('other-status-text');
    const isOnline = !!(data && data.online);
    dot.classList.toggle('online', isOnline);
    text.textContent = isOnline ? 'online' : 'offline';
  });

  // ---- Messages ----
  const messagesEl = document.getElementById('chat-messages');
  const messagesRef = db.ref('messages').limitToLast(200);

  messagesRef.on('child_added', (snap) => {
    const msg = snap.val();
    if(!msg) return;
    const row = document.createElement('div');
    row.className = 'msg-row' + (msg.sender === chatCurrentUserKey ? ' mine' : '');
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    const textSpan = document.createElement('span');
    textSpan.textContent = msg.text || '';
    const timeSpan = document.createElement('span');
    timeSpan.className = 'msg-time';
    const d = msg.ts ? new Date(msg.ts) : new Date();
    timeSpan.textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    bubble.appendChild(textSpan);
    bubble.appendChild(timeSpan);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  });

  function sendMessage(){
    const input = document.getElementById('chat-message-input');
    const text = input.value.trim();
    if(!text) return;
    messagesRef.ref.push({
      sender: chatCurrentUserKey,
      text: text,
      ts: firebase.database.ServerValue.TIMESTAMP
    });
    input.value = '';
  }
  document.getElementById('chat-send-btn').addEventListener('click', sendMessage);
  document.getElementById('chat-message-input').addEventListener('keydown', e => {
    if(e.key === 'Enter') sendMessage();
  });
}
</script>
</body>
</html>
